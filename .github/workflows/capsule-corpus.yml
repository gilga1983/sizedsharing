name: CAPSULE corpus elastic sharing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capsule-corpus.yml'
      - 'apply_experiment_patch.py'
      - 'run_sweep.sh'
      - 'analyze.py'
      - 'oracle_to_adaptsize.py'

jobs:
  trace:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        trace:
          - msr_hm_0
          - msr_prn_0
          - msr_prn_1
          - msr_proj_0
          - msr_proj_1
          - msr_proj_2
          - msr_proj_4
          - msr_prxy_0
          - msr_prxy_1
          - msr_src1_0
          - msr_src1_1
          - msr_usr_1
          - msr_usr_2
          - msr_web_2
          - w90
          - w91
          - w92
          - w93
          - w94
          - w95
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          python3 -m pip install -r requirements.txt

      - name: Resolve CAPSULE trace URL
        id: trace
        shell: bash
        run: |
          case '${{ matrix.trace }}' in
            msr_hm_0)   REL='2007_msr/msr_hm_0.oracleGeneral.zst' ;;
            msr_prn_0)  REL='2007_msr/msr_prn_0.oracleGeneral.zst' ;;
            msr_prn_1)  REL='2007_msr/msr_prn_1.oracleGeneral.zst' ;;
            msr_proj_0) REL='2007_msr/msr_proj_0.oracleGeneral.zst' ;;
            msr_proj_1) REL='2007_msr/msr_proj_1.oracleGeneral.zst' ;;
            msr_proj_2) REL='2007_msr/msr_proj_2.oracleGeneral.zst' ;;
            msr_proj_4) REL='2007_msr/msr_proj_4.oracleGeneral.zst' ;;
            msr_prxy_0) REL='2007_msr/msr_prxy_0.oracleGeneral.zst' ;;
            msr_prxy_1) REL='2007_msr/msr_prxy_1.oracleGeneral.zst' ;;
            msr_src1_0) REL='2007_msr/msr_src1_0.oracleGeneral.zst' ;;
            msr_src1_1) REL='2007_msr/msr_src1_1.oracleGeneral.zst' ;;
            msr_usr_1)  REL='2007_msr/msr_usr_1.oracleGeneral.zst' ;;
            msr_usr_2)  REL='2007_msr/msr_usr_2.oracleGeneral.zst' ;;
            msr_web_2)  REL='2007_msr/msr_web_2.oracleGeneral.zst' ;;
            w90) REL='2015_cloudphysics/w90.oracleGeneral.bin.zst' ;;
            w91) REL='2015_cloudphysics/w91.oracleGeneral.bin.zst' ;;
            w92) REL='2015_cloudphysics/w92.oracleGeneral.bin.zst' ;;
            w93) REL='2015_cloudphysics/w93.oracleGeneral.bin.zst' ;;
            w94) REL='2015_cloudphysics/w94.oracleGeneral.bin.zst' ;;
            w95) REL='2015_cloudphysics/w95.oracleGeneral.bin.zst' ;;
            *) exit 2 ;;
          esac
          echo "url=https://cache-datasets.s3.amazonaws.com/cache_dataset_oracleGeneral/$REL" >> "$GITHUB_OUTPUT"

      - name: Download and convert trace
        run: |
          curl -L --fail --retry 5 --retry-delay 2 '${{ steps.trace.outputs.url }}' -o trace.zst
          zstd -dc trace.zst | python3 oracle_to_adaptsize.py --output trace.tr
          test -s trace.tr
          echo "requests=$(wc -l < trace.tr)"
          du -h trace.zst trace.tr
          rm -f trace.zst

      - name: Run fixed versus elastic at 256 MiB
        env:
          MODES: 'fixed elastic'
          WINDOW_FRACTIONS: '0.01'
          FIXED_CAPACITY_BYTES: '268435456'
          RESULTS_DIR: '${{ github.workspace }}/results/${{ matrix.trace }}'
        run: |
          chmod +x run_sweep.sh
          ./run_sweep.sh --trace trace.tr
          python3 analyze.py "results/${{ matrix.trace }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capsule-elastic-${{ matrix.trace }}
          path: results/${{ matrix.trace }}/
          retention-days: 90

  aggregate:
    needs: trace
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: capsule-elastic-*
          path: downloaded
      - name: Aggregate completed traces
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows=[]
          for p in sorted(Path('downloaded').rglob('elastic_vs_fixed.csv')):
              trace=p.parts[1].replace('capsule-elastic-','') if len(p.parts)>1 else p.parent.name
              with p.open(newline='') as f:
                  data=list(csv.DictReader(f))
              for r in data:
                  r={'trace':trace, **r}
                  rows.append(r)
          if not rows:
              raise SystemExit('no completed trace results')
          out=Path('capsule_elastic_20.csv')
          with out.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)

          def val(r,k): return float(r[k])
          n=len(rows)
          print(f'completed_traces={n}')
          print('mean_object_hit_gain_pp=',sum(val(r,'hit_gain_pp') for r in rows)/n)
          print('mean_byte_hit_gain_pp=',sum(val(r,'weighted_hit_gain_pp') for r in rows)/n)
          print('mean_utilization_gain_pp=',sum(val(r,'utilization_gain_pp') for r in rows)/n)
          print('wins_object=',sum(val(r,'hit_gain_pp')>0 for r in rows))
          print('wins_byte=',sum(val(r,'weighted_hit_gain_pp')>0 for r in rows))
          print('wins_utilization=',sum(val(r,'utilization_gain_pp')>0 for r in rows))
          for r in rows:
              print(r['trace'], r['hit_gain_pp'], r['weighted_hit_gain_pp'], r['utilization_gain_pp'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capsule-elastic-aggregate
          path: capsule_elastic_20.csv
          retention-days: 90
