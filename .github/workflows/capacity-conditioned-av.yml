name: Elastic sized TinyLFU smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      requests:
        description: "Synthetic requests"
        required: true
        default: "200000"

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Python analysis dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run Window-fraction stress sweep
        env:
          MODES: "fixed elastic"
          CAPACITY_FRACTIONS: "0.05"
          WINDOW_FRACTIONS: "0.01 0.05 0.10 0.20 0.40"
          REQUESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.requests || '100000' }}
        run: |
          chmod +x run_sweep.sh
          ./run_sweep.sh --synthetic --requests "$REQUESTS"

      - name: Analyze
        run: python3 analyze.py results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elastic-sized-tinylfu-smoke-results
          path: results/
